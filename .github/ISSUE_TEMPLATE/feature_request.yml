name: Feature request
description: Something Termdeck should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: ["Claude Code", "OpenAI Codex CLI", "Grok", "All of them"]
