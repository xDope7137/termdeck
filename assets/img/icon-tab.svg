<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96"><defs><clipPath id="tab-corners"><rect width="96" height="96" rx="26"/></clipPath></defs><g clip-path="url(#tab-corners)">
  <!-- Termdeck's mark: a window, brand green title bar over a dark screen, with a
       'T' and a shell prompt on it. THE source file, generated by
       design/logo-td/gen-icon.py, whose header explains every number below.
       favicon.ico, icon-192.png, icon-512.png and icon-badge.svg all come from
       this one file by `node scripts/build-icons.mjs`. Edit here, run that, commit
       all of it; never hand edit a raster. A screenshot of this file open in a
       browser is exactly how icon-192.png shipped as a blank green square with a
       scrollbar down its right edge, and favicon.ico wrapped that same PNG.

       Full bleed, and the LOCKUP sits inside the maskable safe circle (r=38.4
       about 48,48), so a launcher may crop the corners to a circle or a squircle
       and the mark is untouched. The three traffic lights do NOT fit that circle:
       at cy 13 it allows nothing past x 32..64, which is dead centre of the bar,
       so they keep the card's right-aligned placement here and build-icons.mjs
       drops the g id="lights" group when it renders icon-maskable-512.png. One
       source, two purposes: the favicon, the apple touch icon and the marketing
       header get the lights, the Android adaptive icon does not get three dots
       sliced in half. The card version, with its margins and shadow, is
       design/logo-td/option-d-unbounded.svg; none of that survives a crop, which
       is why the tile is drawn rather than embedded.

       The letters are Unbounded 800, fully outlined; the chevron and the cursor
       are drawn, not set, because a face's own operators are small, light and sit
       off the cap height. They carry the T's weight and share its baseline, and
       the T's stem is dropped to the chevron's tip so all three bottom out on one
       line. The gradients are what stop the tile reading as two flat CSS
       rectangles at 512px; the bar's midpoint is the brand-green-400 token
       (#6de95c) the rest of the product uses.

       Keep this file well formed XML. Served as image/svg+xml it is parsed by a
       strict XML parser, and a comment may not contain a double hyphen: naming
       that token with its CSS prefix broke every img pointing here (the app bar,
       the nav rail, both marketing headers, the SVG favicon) while leaving the
       PNGs perfect, because build-icons.mjs inlines this into HTML, where the
       lenient parser accepts it. tests/icons.mjs parses it as XML now. -->
  <defs>
    <linearGradient id="td-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83f074"/>
      <stop offset="1" stop-color="#4fd63d"/>
    </linearGradient>
    <linearGradient id="td-screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1a221c"/>
      <stop offset="1" stop-color="#0d1210"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#td-screen)"/>
  <rect width="96" height="26" fill="url(#td-bar)"/>
  <g id="lights" fill="#0f2a0c" opacity="0.88">
    <circle cx="60" cy="13" r="3.4"/>
    <circle cx="71" cy="13" r="3.4"/>
    <circle cx="82" cy="13" r="3.4"/>
  </g>
  <g transform="translate(14.92 64.95) scale(0.3175)" fill="#ffffff">
    <path d="M29.80 -64.90H53.08V0.00H29.80ZM2.00 -75.00H80.88V-54.28H2.00Z"/>
    <path d="M29.80 -1 H53.08 V9.50 H29.80 Z"/>
    <g fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96.90 -69.00 L131.40 -34.50 L96.90 0.00"/>
      <path d="M150.40 -9.50 H196.90"/>
    </g>
  </g>
</g></svg>